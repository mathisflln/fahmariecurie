<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - FAH Marie-Curie</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
    
    <!-- CSS - UN SEUL FICHIER QUI IMPORTE TOUT -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Stack Sans Headline", sans-serif;
            background-image: url('assets/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        .logo {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 100;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        .contact-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-top: 80px;
            margin-bottom: 40px;
        }

        .contact-container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0d0d0d;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 32px;
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="email"],
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-family: "Stack Sans Headline", sans-serif;
            font-weight: 300;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #0d0d0d;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        select {
            cursor: pointer;
            font-weight: 400;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            background: #0d0d0d;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: "Stack Sans Headline", sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #2d2d2d;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
            display: none;
        }

        .btn-submit.loading .loading-spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            text-align: center;
            display: none;
        }

        #message.show {
            display: block;
        }

        #message.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        #message.error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s ease;
        }

        .back-link a:hover {
            color: #0d0d0d;
        }

        .contact-info {
            text-align: center;
            margin-top: 32px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .contact-info h3 {
            font-size: 1.1rem;
            color: #0d0d0d;
            margin-bottom: 12px;
        }

        .contact-info p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .contact-info a {
            color: #0d0d0d;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .logo {
                top: 20px;
                left: 20px;
            }

            .logo img {
                height: 40px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .contact-wrapper {
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="logo">
        <img src="assets/logos/fah.png" alt="FAH Marie-Curie" />
    </a>

    <div class="contact-wrapper">
        <div class="contact-container">
            <h1>Contactez-nous</h1>
            <p class="subtitle">
                Une question, une suggestion ou besoin d'aide ?<br>
                Remplissez le formulaire ci-dessous et nous vous répondrons dans les plus brefs délais.
            </p>
            
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Nom complet *</label>
                    <input 
                        type="text" 
                        id="name" 
                        placeholder="Votre nom" 
                        required 
                    />
                </div>

                <div class="form-group">
                    <label for="email">Adresse email *</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="votre.email@exemple.com" 
                        required 
                    />
                </div>

                <div class="form-group">
                    <label for="subject">Sujet *</label>
                    <select id="subject" required>
                        <option value="">Sélectionnez un sujet</option>
                        <option value="question">Question générale</option>
                        <option value="intervention">Demande d'intervention</option>
                        <option value="partenariat">Proposition de partenariat</option>
                        <option value="don">Question sur les dons</option>
                        <option value="jeu">Commander le jeu Safe Play</option>
                        <option value="safe-place">Safe Place / Signalement</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea 
                        id="message-text" 
                        placeholder="Décrivez votre demande en détail..."
                        required
                    ></textarea>
                </div>
                
                <button type="submit" class="btn-submit" id="submit-btn">
                    Envoyer le message
                    <span class="loading-spinner"></span>
                </button>
            </form>
            
            <div id="message"></div>
            
            <div class="back-link">
                <a href="index.html">← Retour à l'accueil</a>
            </div>

            <div class="contact-info">
                <h3>Autres moyens de nous contacter</h3>
                <p>
                    Email direct : <a href="mailto:fahmariecurie.pro@gmail.com">fahmariecurie.pro@gmail.com</a>
                    <br>
                    Réponse sous 48h en moyenne
                </p>
            </div>
        </div>
    </div>

    <img src="assets/images/sticker-black.png" alt="sticker écouter sans juger" class="floating-img img1 float-left">
    <img src="assets/images/sticker-fah.png" alt="sticker FAH" class="floating-img img2 float-right">
    <img src="assets/images/message1.svg" alt="message" class="floating-img img3 float-left">
    <img src="assets/images/scrapbook.png" alt="scrapbook" class="floating-img img4 float-right">
    <img src="assets/images/message2.svg" alt="message" class="floating-img img5 float-down">
    <img src="assets/images/message3.svg" alt="message" class="floating-img img6 float-right">
    <img src="assets/images/postit1.svg" alt="post-it" class="floating-img img7 float-left">
    <img src="assets/images/paper.png" alt="papier" class="floating-img img8 float-right">
    <img src="assets/images/scotch.png" alt="scotch" class="floating-img img9 float-right">

    <script>
        const SUPABASE_URL = "https://ckfdysasgawyixbxjyfz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrZmR5c2FzZ2F3eWl4YnhqeWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5ODg1NjcsImV4cCI6MjA3NzU2NDU2N30.t0ubaRk5sz7kewyEsOg4CpFvj47S9U1J1SP_3DQBmE8";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('contact-form');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            messageEl.classList.remove('show', 'success', 'error');
            messageEl.textContent = '';
            
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value;
            const messageText = document.getElementById('message-text').value.trim();

            try {
                // Insérer le message dans Supabase
                const { data, error } = await supabase
                    .from('contact_messages')
                    .insert([
                        {
                            name: name,
                            email: email,
                            subject: subject,
                            message: messageText,
                            status: 'new',
                            created_at: new Date().toISOString()
                        }
                    ])
                    .select();
                
                if (error) throw error;
                
                // Appeler l'Edge Function pour envoyer l'email
                try {
                    await supabase.functions.invoke('send-contact-email', {
                        body: { name, email, subject, message: messageText }
                    });
                } catch (emailError) {
                    console.warn('Email notification failed:', emailError);
                    // On continue même si l'email échoue - le message est sauvegardé
                }
                
                messageEl.className = 'show success';
                messageEl.textContent = '✓ Message envoyé avec succès ! Nous vous répondrons dans les plus brefs délais.';
                
                // Réinitialiser le formulaire
                form.reset();
                
            } catch (error) {
                console.error('Erreur:', error);
                
                messageEl.className = 'show error';
                messageEl.textContent = 'Une erreur est survenue. Veuillez réessayer ou nous contacter directement par email.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        // Nettoyer le message d'erreur lors de la modification des champs
        ['name', 'email', 'subject', 'message-text'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                messageEl.classList.remove('show');
            });
        });
    </script>
</body>
</html>
